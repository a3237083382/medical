<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保险公司业务系统 - 嵌入医疗查询演示</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ef;
      --soft: #f5f8fc;
      --panel: #ffffff;
      --nav: #101828;
      --nav-soft: #1d2939;
      --brand: #1957a6;
      --brand-strong: #0d4385;
      --accent: #168464;
      --warning: #b7791f;
      --shadow: 0 18px 44px rgba(20, 39, 68, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #eef3f8;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 14px;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      background: var(--nav);
      color: #d7deea;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .host-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      min-height: 42px;
    }

    .host-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--nav);
      font-weight: 900;
    }

    .host-brand strong {
      display: block;
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
    }

    .host-brand span {
      display: block;
      margin-top: 3px;
      color: #98a2b3;
      font-size: 12px;
    }

    .nav-block {
      display: grid;
      gap: 6px;
    }

    .nav-title {
      padding: 0 10px 5px;
      color: #98a2b3;
      font-size: 12px;
    }

    .nav-item {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 7px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d7deea;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .nav-item::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: .78;
      flex: 0 0 auto;
    }

    .nav-item:hover {
      background: var(--nav-soft);
    }

    .nav-item.active {
      color: #0d4385;
      background: #eef6ff;
      font-weight: 700;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 13px;
    }

    .operator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    .content {
      min-height: calc(100vh - 58px);
      padding: 20px;
      min-width: 0;
    }

    .placeholder {
      display: grid;
      gap: 18px;
    }

    .hero {
      min-height: 160px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      background: #fff;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .status-pill {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #12634d;
      background: #effaf5;
      border: 1px solid #b9d8ca;
      white-space: nowrap;
      font-weight: 700;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      min-height: 110px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }

    .card span {
      color: var(--muted);
      font-size: 12px;
    }

    .card strong {
      display: block;
      margin-top: 10px;
      font-size: 24px;
    }

    .card small {
      display: block;
      margin-top: 10px;
      color: var(--muted);
    }

    .embed-panel {
      display: none;
      min-width: 0;
    }

    .embed-panel.active {
      display: block;
    }

    .embed-frame {
      width: 100%;
      height: calc(100vh - 98px);
      min-height: 740px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 1000px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .topbar {
        height: auto;
        min-height: 58px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 12px 16px;
      }

      .content {
        padding: 12px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .embed-frame {
        min-height: 820px;
        height: calc(100vh - 110px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="host-brand">
        <div class="host-logo">保</div>
        <div>
          <strong>保险公司业务系统</strong>
          <span>承保与核保工作台</span>
        </div>
      </div>

      <div class="nav-block">
        <div class="nav-title">工作台</div>
        <button class="nav-item active" type="button" data-view="dashboard">首页概览</button>
        <button class="nav-item" type="button" data-view="application">投保申请</button>
        <button class="nav-item" type="button" data-view="customer">客户资料</button>
        <button class="nav-item" type="button" data-view="medical">医疗保险公司查询</button>
        <button class="nav-item" type="button" data-view="underwrite">核保任务</button>
      </div>

      <div class="nav-block">
        <div class="nav-title">业务管理</div>
        <button class="nav-item" type="button" data-view="policy">保单管理</button>
        <button class="nav-item" type="button" data-view="claim">理赔管理</button>
        <button class="nav-item" type="button" data-view="renewal">续保提醒</button>
        <button class="nav-item" type="button" data-view="report">统计报表</button>
      </div>

      <div class="nav-block">
        <div class="nav-title">系统</div>
        <button class="nav-item" type="button" data-view="org">机构人员</button>
        <button class="nav-item" type="button" data-view="settings">系统设置</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">工作台 / 首页概览</div>
        <div class="operator">
          <span>核保员：张经理</span>
          <span class="avatar">张</span>
        </div>
      </header>

      <section class="content">
        <div class="placeholder" id="placeholder">
          <div class="hero">
            <div>
              <h1 id="pageTitle">首页概览</h1>
              <p id="pageDesc">这里模拟保险公司自己已有的业务系统。点击左侧“医疗保险公司查询”，内容区会嵌入我方医疗查询页面。</p>
            </div>
            <div class="status-pill">内部系统运行中</div>
          </div>

          <div class="cards">
            <div class="card">
              <span>今日投保申请</span>
              <strong>128</strong>
              <small>较昨日 +12</small>
            </div>
            <div class="card">
              <span>待核保任务</span>
              <strong>36</strong>
              <small>高优先级 7 条</small>
            </div>
            <div class="card">
              <span>待补充资料</span>
              <strong>19</strong>
              <small>客户资料待完善</small>
            </div>
            <div class="card">
              <span>医疗查询接入</span>
              <strong>已开通</strong>
              <small>由我方平台提供服务</small>
            </div>
          </div>

        </div>

        <div class="embed-panel" id="embedPanel">
          <iframe
            class="embed-frame"
            id="medicalFrame"
            src="about:blank"
            title="医疗信息查询平台">
          </iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    const labels = {
      dashboard: ["工作台 / 首页概览", "首页概览", "这里模拟保险公司自己已有的业务系统。点击左侧“医疗保险公司查询”，内容区会嵌入我方医疗查询页面。"],
      application: ["业务办理 / 投保申请", "投保申请", "这里是保险公司自己的投保申请页面，当前只做菜单演示。"],
      customer: ["业务办理 / 客户资料", "客户资料", "这里是保险公司自己的客户资料页面，当前只做菜单演示。"],
      underwrite: ["业务办理 / 核保任务", "核保任务", "这里是保险公司自己的核保任务页面，当前只做菜单演示。"],
      policy: ["业务管理 / 保单管理", "保单管理", "这里是保险公司自己的保单管理页面，当前只做菜单演示。"],
      claim: ["业务管理 / 理赔管理", "理赔管理", "这里是保险公司自己的理赔管理页面，当前只做菜单演示。"],
      renewal: ["业务管理 / 续保提醒", "续保提醒", "这里是保险公司自己的续保提醒页面，当前只做菜单演示。"],
      report: ["业务管理 / 统计报表", "统计报表", "这里是保险公司自己的统计报表页面，当前只做菜单演示。"],
      org: ["系统 / 机构人员", "机构人员", "这里是保险公司自己的机构人员页面，当前只做菜单演示。"],
      settings: ["系统 / 系统设置", "系统设置", "这里是保险公司自己的系统设置页面，当前只做菜单演示。"]
    };

    const medicalUrl = "http://localhost:8083/company/medical-query";
    const navItems = Array.from(document.querySelectorAll(".nav-item"));
    const breadcrumb = document.getElementById("breadcrumb");
    const placeholder = document.getElementById("placeholder");
    const embedPanel = document.getElementById("embedPanel");
    const medicalFrame = document.getElementById("medicalFrame");
    const pageTitle = document.getElementById("pageTitle");
    const pageDesc = document.getElementById("pageDesc");

    function setActive(view) {
      navItems.forEach(item => item.classList.toggle("active", item.dataset.view === view));

      if (view === "medical") {
        breadcrumb.textContent = "业务办理 / 医疗保险公司查询";
        placeholder.style.display = "none";
        embedPanel.classList.add("active");
        if (medicalFrame.src === "about:blank") {
          medicalFrame.src = medicalUrl;
        }
        return;
      }

      const text = labels[view] || labels.dashboard;
      breadcrumb.textContent = text[0];
      pageTitle.textContent = text[1];
      pageDesc.textContent = text[2];
      embedPanel.classList.remove("active");
      placeholder.style.display = "grid";
    }

    navItems.forEach(item => {
      item.addEventListener("click", () => setActive(item.dataset.view));
    });
  </script>
</body>
</html>
