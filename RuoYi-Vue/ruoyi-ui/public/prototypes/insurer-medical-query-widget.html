<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>医疗信息查询平台</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ef;
      --soft: #f5f8fc;
      --brand: #1957a6;
      --brand-strong: #0d4385;
      --accent: #168464;
      --danger: #b42318;
      --warning: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .header {
      min-height: 62px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .symbol {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--brand-strong);
      background: #e8f1fb;
      font-weight: 900;
    }
    .brand strong {
      display: block;
      font-size: 17px;
    }
    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      color: var(--muted);
      white-space: nowrap;
    }
    .status b {
      color: var(--accent);
    }
    .wrap {
      padding: 20px 24px 22px;
      display: grid;
      gap: 16px;
      flex: 1;
    }
    .login, .panel, .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-width: 0;
    }
    .head {
      min-height: 52px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .head h2 {
      margin: 0;
      font-size: 16px;
    }
    .head small {
      color: var(--muted);
      font-size: 12px;
    }
    .login-form {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 16px;
      opacity: .48;
      pointer-events: none;
    }
    .workspace.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    .form {
      padding: 18px;
      display: grid;
      gap: 15px;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    label {
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }
    .required {
      color: var(--danger);
      margin-left: 2px;
    }
    .control {
      width: 100%;
      height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      outline: none;
      background: #fff;
    }
    .control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(25, 87, 166, .12);
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .price {
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 7px;
      background: var(--soft);
      color: var(--muted);
    }
    .price strong {
      color: var(--warning);
      font-size: 16px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      min-width: 88px;
      height: 40px;
      border: 0;
      border-radius: 7px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-primary {
      color: #fff;
      background: var(--brand);
    }
    .btn-primary:hover {
      background: var(--brand-strong);
    }
    .btn-ghost {
      color: var(--brand);
      background: #edf4fc;
    }
    .alert {
      display: none;
      border-radius: 7px;
      padding: 9px 10px;
      line-height: 1.6;
    }
    .error {
      color: var(--danger);
      background: #fff2f0;
      border: 1px solid #fecdca;
    }
    .ok {
      color: #12634d;
      background: #effaf5;
      border: 1px solid #b9d8ca;
    }
    .empty {
      min-height: 360px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 34px 20px;
    }
    .empty-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #edf4fc;
      color: var(--brand);
      font-size: 24px;
      font-weight: 900;
    }
    .result-body {
      display: none;
      padding: 18px;
      gap: 16px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 13px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .metric strong {
      display: block;
      font-size: 16px;
      overflow-wrap: anywhere;
    }
    .notice {
      border-left: 4px solid var(--accent);
      background: #effaf5;
      color: #165b47;
      padding: 12px 14px;
      line-height: 1.7;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.6;
    }
    th {
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
      white-space: nowrap;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--brand-strong);
      background: #eef6ff;
      font-size: 12px;
      font-weight: 700;
    }
    @media (max-width: 900px) {
      .login-form, .workspace { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 14px 16px;
      }
      .wrap { padding: 12px; }
      .summary { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <div class="symbol">医</div>
        <div>
          <strong>医疗信息查询平台</strong>
          <span>保险公司嵌入式查询模块</span>
        </div>
      </div>
      <div class="status" id="statusText">状态：<b>待登录</b></div>
    </header>

    <main class="wrap">
      <section class="login">
        <div class="head">
          <h2>保险公司账号登录</h2>
          <small>静态原型：任意非空账号密码均可登录</small>
        </div>
        <form class="login-form" id="loginForm">
          <div class="field">
            <label for="username">账号<span class="required">*</span></label>
            <input class="control" id="username" type="text" value="demo_company" autocomplete="off">
          </div>
          <div class="field">
            <label for="password">密码<span class="required">*</span></label>
            <input class="control" id="password" type="password" value="123456" autocomplete="off">
          </div>
          <button class="btn btn-primary" type="submit" id="loginBtn">登录</button>
          <div class="alert error" id="loginError"></div>
          <div class="alert ok" id="loginOk"></div>
        </form>
      </section>

      <div class="workspace" id="workspace">
        <section class="panel">
          <div class="head">
            <h2>投保人医疗信息查询</h2>
            <small>选择接口并输入投保人信息</small>
          </div>
          <form class="form" id="queryForm">
            <div class="field">
              <label for="queryType">查询接口<span class="required">*</span></label>
              <select class="control" id="queryType">
                <option value="basic" data-price="10.00">基础医疗风险查询</option>
                <option value="hospital" data-price="12.00">住院记录查询</option>
                <option value="chronic" data-price="15.00">慢病及特病查询</option>
              </select>
              <div class="hint">正式版本中，接口列表由我方平台按保险公司权限返回。</div>
            </div>
            <div class="field">
              <label for="personName">投保人姓名<span class="required">*</span></label>
              <input class="control" id="personName" type="text" placeholder="请输入姓名" autocomplete="off">
            </div>
            <div class="field">
              <label for="idCard">身份证号<span class="required">*</span></label>
              <input class="control" id="idCard" type="text" placeholder="请输入18位身份证号" maxlength="18" autocomplete="off">
            </div>
            <div class="price">
              <span>本次查询费用</span>
              <strong id="feeText">￥10.00</strong>
            </div>
            <div class="alert error" id="queryError"></div>
            <div class="actions">
              <button class="btn btn-primary" type="submit" id="queryBtn">查询</button>
              <button class="btn btn-ghost" type="button" id="resetBtn">清空</button>
            </div>
          </form>
        </section>

        <section class="result">
          <div class="head">
            <h2>查询结果</h2>
            <small id="resultMeta">等待查询</small>
          </div>
          <div class="empty" id="emptyState">
            <div>
              <div class="empty-icon">查</div>
              <div>登录后输入投保人信息，查询结果会显示在这里。</div>
            </div>
          </div>
          <div class="result-body" id="resultBody">
            <div class="summary">
              <div class="metric"><span>姓名</span><strong id="maskedName">-</strong></div>
              <div class="metric"><span>身份证号</span><strong id="maskedId">-</strong></div>
              <div class="metric"><span>接口类型</span><strong id="resultType">-</strong></div>
              <div class="metric"><span>查询流水号</span><strong id="serialNo">-</strong></div>
            </div>
            <div class="notice" id="riskSummary">未发现样例高风险医疗记录。正式环境以数据源返回结果为准。</div>
            <table>
              <thead>
                <tr><th>项目</th><th>结果</th><th>说明</th></tr>
              </thead>
              <tbody id="recordRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const recordsByType = {
      basic: [
        ["医疗风险汇总", "低风险", "样例数据未命中重大疾病、长期住院或高频就诊记录"],
        ["最近就诊", "2026-04-18", "普通门诊，样例返回"],
        ["数据处理", "已脱敏", "身份证号、诊断描述按平台规则脱敏展示"]
      ],
      hospital: [
        ["住院记录", "1条", "样例记录：2025-12 普通住院"],
        ["住院天数", "5天", "正式环境按数据源实际字段返回"],
        ["费用区间", "5000-10000元", "仅展示脱敏后的风险评估信息"]
      ],
      chronic: [
        ["慢病记录", "未命中", "样例数据未发现慢病目录记录"],
        ["特病记录", "未命中", "样例数据未发现特病备案记录"],
        ["核保提示", "可继续人工复核", "正式规则以业务配置为准"]
      ]
    };

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const loginOk = document.getElementById("loginOk");
    const statusText = document.getElementById("statusText");
    const workspace = document.getElementById("workspace");
    const queryForm = document.getElementById("queryForm");
    const queryType = document.getElementById("queryType");
    const feeText = document.getElementById("feeText");
    const queryError = document.getElementById("queryError");
    const queryBtn = document.getElementById("queryBtn");
    const resetBtn = document.getElementById("resetBtn");
    const emptyState = document.getElementById("emptyState");
    const resultBody = document.getElementById("resultBody");
    const resultMeta = document.getElementById("resultMeta");
    const maskedName = document.getElementById("maskedName");
    const maskedId = document.getElementById("maskedId");
    const resultType = document.getElementById("resultType");
    const serialNo = document.getElementById("serialNo");
    const riskSummary = document.getElementById("riskSummary");
    const recordRows = document.getElementById("recordRows");

    function selectedOption() {
      return queryType.options[queryType.selectedIndex];
    }
    function show(el, message) {
      el.textContent = message;
      el.style.display = "block";
    }
    function hide(el) {
      el.textContent = "";
      el.style.display = "none";
    }
    function updateFee() {
      feeText.textContent = "￥" + selectedOption().dataset.price;
    }
    function isValidIdCard(value) {
      return /^[0-9]{17}[0-9Xx]$/.test(value.trim());
    }
    function maskName(value) {
      const name = value.trim();
      if (name.length <= 1) return "*";
      return name[0] + "*".repeat(Math.max(name.length - 1, 1));
    }
    function maskId(value) {
      const id = value.trim();
      if (id.length < 8) return "****";
      return id.slice(0, 4) + "**********" + id.slice(-4);
    }
    function renderRows(type) {
      recordRows.innerHTML = recordsByType[type].map(row => {
        return "<tr><td>" + row[0] + "</td><td><span class=\"tag\">" + row[1] + "</span></td><td>" + row[2] + "</td></tr>";
      }).join("");
    }

    loginForm.addEventListener("submit", event => {
      event.preventDefault();
      hide(loginError);
      hide(loginOk);
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) {
        show(loginError, "请输入账号和密码。");
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent = "登录中...";
      window.setTimeout(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = "登录";
        statusText.innerHTML = "状态：<b>已登录：示例保险公司</b>";
        workspace.classList.add("enabled");
        show(loginOk, "登录成功。现在可以查询投保人医疗信息。");
      }, 300);
    });

    queryType.addEventListener("change", updateFee);

    resetBtn.addEventListener("click", () => {
      queryForm.reset();
      updateFee();
      hide(queryError);
      resultBody.style.display = "none";
      emptyState.style.display = "grid";
      resultMeta.textContent = "等待查询";
    });

    queryForm.addEventListener("submit", event => {
      event.preventDefault();
      hide(queryError);
      const name = document.getElementById("personName").value.trim();
      const idCard = document.getElementById("idCard").value.trim();
      if (!name) {
        show(queryError, "请输入投保人姓名。");
        return;
      }
      if (!isValidIdCard(idCard)) {
        show(queryError, "请输入正确的18位身份证号。");
        return;
      }
      queryBtn.disabled = true;
      queryBtn.textContent = "查询中...";
      window.setTimeout(() => {
        const now = new Date();
        const type = queryType.value;
        maskedName.textContent = maskName(name);
        maskedId.textContent = maskId(idCard);
        resultType.textContent = selectedOption().textContent;
        serialNo.textContent = "MQ" + now.getTime();
        resultMeta.textContent = now.toLocaleString("zh-CN", { hour12: false });
        riskSummary.textContent = type === "hospital"
          ? "样例返回存在普通住院记录，建议结合保险公司核保规则继续审核。"
          : "未发现样例高风险医疗记录。正式环境以数据源返回结果为准。";
        renderRows(type);
        emptyState.style.display = "none";
        resultBody.style.display = "grid";
        queryBtn.disabled = false;
        queryBtn.textContent = "查询";
      }, 420);
    });

    updateFee();
  </script>
</body>
</html>
