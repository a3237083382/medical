<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医疗查询信息平台</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  font-size:14px;
  color:#14213d;
  background:#eef4f8;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#cfd9e5; border-radius:4px; }

.page { min-height:100vh; padding:24px; }
.shell { max-width:1160px; margin:0 auto; }

/* header */
.header {
  min-height:76px; padding:18px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  background:#fff; border:1px solid #d8e2ec; border-radius:8px;
  box-shadow:0 18px 42px rgba(28,44,74,.08);
}
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-icon {
  width:42px; height:42px; border-radius:8px;
  display:grid; place-items:center;
  color:#fff; background:#1957a6;
  font-size:20px; font-weight:900; flex:0 0 auto;
}
.brand-title { color:#0f1d35; font-size:20px; font-weight:800; line-height:1.25; }
.brand-subtitle { margin-top:4px; color:#667085; font-size:13px; }

.state {
  min-height:36px; padding:0 14px;
  border:1px solid #b9ddcc; border-radius:999px;
  display:inline-flex; align-items:center; gap:8px;
  color:#08734f; background:#eefaf5;
  white-space:nowrap; font-weight:700;
}
.state::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
.state.inactive { border-color:#d8e2ec; color:#667085; background:#f8fafc; }
.state.error { border-color:#f5c6c6; color:#b54708; background:#fef4f4; }

/* remaining count badge */
.remaining-badge {
  min-height:36px; padding:0 14px;
  border:1px solid #d8e2ec; border-radius:999px;
  display:inline-flex; align-items:center; gap:8px;
  color:#344054; background:#f8fafc;
  white-space:nowrap; font-weight:700; font-size:13px;
}
.remaining-badge .num { color:#1957a6; font-size:16px; font-weight:800; }

/* main */
.main { margin-top:18px; display:grid; grid-template-columns:380px 1fr; gap:18px; align-items:start; }

.panel {
  background:#fff; border:1px solid #d8e2ec; border-radius:8px;
  box-shadow:0 18px 42px rgba(28,44,74,.08); min-width:0;
}
.panel-head { padding:18px 20px 12px; border-bottom:1px solid #e5edf5; }
.panel-head h2 { margin:0; color:#0f1d35; font-size:17px; }
.panel-head .sub { display:block; margin-top:5px; color:#667085; font-size:13px; }

/* form */
.form { padding:18px 20px 20px; display:grid; gap:15px; }
.field { display:grid; gap:7px; }
.field label { color:#344054; font-weight:700; font-size:13px; }
.field input,.field select {
  width:100%; height:42px;
  border:1px solid #cfd9e5; border-radius:7px;
  padding:0 12px; color:#172033; background:#fff;
  outline:none; font-size:14px;
}
.field input:focus,.field select:focus { border-color:#1957a6; box-shadow:0 0 0 3px rgba(25,87,166,.12); }

/* data type toggle */
.data-type-row { display:flex; gap:0; border:1px solid #cfd9e5; border-radius:7px; overflow:hidden; }
.data-type-row button {
  flex:1; height:40px; border:none;
  font-size:13px; font-weight:700; cursor:pointer;
  background:#fff; color:#667085; transition:all .15s;
}
.data-type-row button.active { background:#1957a6; color:#fff; }
.data-type-row button:not(.active):hover { background:#f0f4f8; }

.button-row { display:flex; gap:10px; flex-wrap:wrap; }
.btn {
  height:42px; min-width:108px; border:0; border-radius:7px;
  padding:0 18px; color:#fff; background:#1957a6;
  cursor:pointer; font-weight:800; font-size:14px;
  transition:opacity .15s;
}
.btn:hover { opacity:.85; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.secondary { color:#344054; background:#edf2f7; }
.btn.secondary:hover { opacity:1; background:#e2e9f2; }

.hint { color:#667085; font-size:12px; line-height:1.6; }

/* result */
.result { padding:18px 20px 20px; }

.empty {
  min-height:308px; border:1px dashed #cfd9e5; border-radius:8px;
  display:grid; place-items:center;
  color:#667085; text-align:center; background:#f8fafc;
}
.empty strong { display:block; margin-bottom:8px; color:#344054; font-size:18px; }

.result-body { display:none; gap:14px; }
.result-body.active { display:grid; }

.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.metric {
  border:1px solid #d8e2ec; border-radius:8px; padding:12px; background:#fafcfe;
}
.metric span { display:block; font-size:12px; color:#667085; margin-bottom:4px; }
.metric strong { font-size:15px; color:#14213d; }

.summary {
  border-left:4px solid #1957a6; border-radius:7px;
  padding:10px 14px; font-size:13px; color:#344054; background:#f8fafc;
}

table { width:100%; border-collapse:collapse; font-size:13px; }
thead th {
  background:#f0f4f8; color:#344054; font-weight:700;
  text-align:left; padding:10px 14px;
  border-bottom:2px solid #d8e2ec; font-size:12px;
}
tbody td { padding:10px 14px; border-bottom:1px solid #e5edf5; color:#172033; }
tbody tr:last-child td { border-bottom:0; }

.result-body table td .tag-red { color:#fff; background:#e04f5f; }
.result-body table td .tag-orange { color:#fff; background:#e8943a; }
.result-body table td .tag-green { color:#fff; background:#2e9a6e; }

</style>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">医</div>
        <div>
          <div class="brand-title">医疗查询信息平台</div>
          <div class="brand-subtitle">湖南省医疗信息实时查询</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="state inactive" id="connState">未接入</div>
        <div class="remaining-badge" id="remainingBadge" style="display:none">
          本月剩余 <span class="num" id="remainingCount">-</span> 次
        </div>
      </div>
    </div>

    <div class="main">
      <!-- 左侧面板 -->
      <div class="panel">
        <div class="panel-head">
          <h2>查询设置</h2>
          <span class="sub">粘贴 AppKey 接入后发起查询</span>
        </div>
        <div class="form">
          <div class="field">
            <label for="appKeyInput">AppKey</label>
            <input id="appKeyInput" type="password" placeholder="请粘贴保险公司 AppKey" autocomplete="off">
            <button class="btn" id="applyKeyBtn" style="margin-top:4px;height:36px;min-width:0;font-size:13px">接入</button>
          </div>

          <hr style="border:none;border-top:1px solid #e5edf5">

          <div class="data-type-row" id="dataTypeToggle">
            <button data-type="realtime" class="active">实时数据</button>
            <button data-type="history">延时精准数据</button>
          </div>

          <div class="field">
            <label for="queryType" id="queryTypeLabel">查询类型</label>
            <select id="queryType"><option value="">请先接入 AppKey</option></select>
          </div>

          <div class="field">
            <label for="personName">姓名</label>
            <input id="personName" placeholder="请输入患者姓名">
          </div>

          <div class="field">
            <label for="idCard">身份证号</label>
            <input id="idCard" placeholder="请输入 18 位身份证号" maxlength="18">
          </div>

          <div class="button-row">
            <button class="btn" id="queryBtn" disabled>请先接入 AppKey</button>
            <button class="btn secondary" id="resetBtn" type="button">清空</button>
          </div>

          <div class="hint" id="keyHint"></div>
        </div>
      </div>

      <!-- 右侧结果面板 -->
      <div class="panel">
        <div class="panel-head">
          <h2>查询结果</h2>
        </div>
        <div class="result">
          <div class="empty" id="emptyResult">
            <div>
              <strong>等待查询</strong>
              <span>接入 AppKey 后，输入信息即可查询</span>
            </div>
          </div>

          <div class="result-body" id="resultBody">
            <div class="metrics">
              <div class="metric">
                <span>结果状态</span>
                <strong id="resultStatus">-</strong>
              </div>
              <div class="metric">
                <span>服务状态</span>
                <strong id="serviceStatus">-</strong>
              </div>
              <div class="metric">
                <span>查询时间</span>
                <strong id="resultTime">-</strong>
              </div>
            </div>

            <div class="summary" id="resultSummary"></div>

            <table id="resultTable">
              <thead>
                <tr>
                  <th style="width:24%">类型</th>
                  <th style="width:34%">内容</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="resultRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = "http://localhost:8088";

// state
let _allQueryTypes = [];
let _appKey = '';
let _dataType = 'realtime';

// dom
const connState = document.getElementById('connState');
const remainingBadge = document.getElementById('remainingBadge');
const remainingCount = document.getElementById('remainingCount');
const appKeyInput = document.getElementById('appKeyInput');
const applyKeyBtn = document.getElementById('applyKeyBtn');
const keyHint = document.getElementById('keyHint');
const queryType = document.getElementById('queryType');
const queryBtn = document.getElementById('queryBtn');
const resetBtn = document.getElementById('resetBtn');
const emptyResult = document.getElementById('emptyResult');
const resultBody = document.getElementById('resultBody');
const resultStatus = document.getElementById('resultStatus');
const serviceStatus = document.getElementById('serviceStatus');
const resultTime = document.getElementById('resultTime');
const resultSummary = document.getElementById('resultSummary');
const resultRows = document.getElementById('resultRows');

function init() {
  const urlKey = new URLSearchParams(location.search).get('appKey') || '';
  if (urlKey) { appKeyInput.value = urlKey; applyKey(); }

  document.querySelectorAll('#dataTypeToggle button').forEach(function(b) {
    b.addEventListener('click', function() {
      document.querySelectorAll('#dataTypeToggle button').forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
      _dataType = this.dataset.type;
      filterTypes();
    });
  });

  applyKeyBtn.addEventListener('click', applyKey);
  queryBtn.addEventListener('click', doQuery);
  resetBtn.addEventListener('click', resetForm);
}

function request(path, opts) {
  var headers = Object.assign({ 'Content-Type': 'application/json' }, (opts && opts.headers) || {});
  return fetch(API_BASE_URL + path, Object.assign({}, opts, { headers }))
    .then(function(r) { return r.text().then(function(t) {
      var j = {};
      try { j = t ? JSON.parse(t) : {}; } catch(e) { throw new Error('服务器返回非 JSON 数据'); }
      if (!r.ok || j.code !== 200) throw new Error(j.msg || '请求失败');
      return j;
    });});
}

function applyKey() {
  var raw = (appKeyInput.value || '').replace(/[\s\u200B-\u200D\uFEFF]/g, '');
  if (!raw || raw.length < 16) {
    setConn('error', '无效 Key');
    keyHint.textContent = '请粘贴完整的 32 位 AppKey';
    queryBtn.disabled = true; queryBtn.textContent = 'AppKey 无效';
    return;
  }
  _appKey = raw;
  setConn('active', '验证中…');
  keyHint.textContent = '正在验证 AppKey…';
  loadTypes().then(function() {
    setConn('active', '已接入');
    keyHint.textContent = 'AppKey 验证通过，可发起查询';
    queryBtn.disabled = false; queryBtn.textContent = '查询';
    loadRemaining();
  }).catch(function(err) {
    setConn('error', '接入失败');
    keyHint.textContent = '接入失败：' + err.message;
    queryBtn.disabled = true; queryBtn.textContent = '接入失败';
  });
}

function setConn(cls, text) {
  connState.className = 'state ' + cls;
  connState.textContent = text;
}

function authHeaders() { return { 'X-App-Key': _appKey }; }

function loadTypes() {
  return request('/company/embed/medical/query-types', { method:'GET', headers: authHeaders() })
    .then(function(j) {
      _allQueryTypes = Array.isArray(j.data) ? j.data : [];
      filterTypes();
    });
}

function loadRemaining() {
  request('/company/embed/medical/usage', { method:'GET', headers: authHeaders() })
    .then(function(j) {
      var usage = j.data || {};
      var remain = usage.remaining || 0;
      remainingCount.textContent = Math.floor(Number(remain));
      remainingBadge.style.display = 'inline-flex';
    })
    .catch(function() {
      remainingBadge.style.display = 'none';
    });
}

function filterTypes() {
  if (_dataType === 'history') {
    var filtered = _allQueryTypes.filter(function(t) { return t.queryType.indexOf('precision_') === 0; });
    if (filtered.length) {
      queryType.innerHTML = filtered.map(function(t) {
        return '<option value="' + t.queryType + '">' + (t.queryName || t.queryType) + '</option>';
      }).join('');
    } else {
      queryType.innerHTML = '<option value="precision_insurance">医保报销记录查询</option><option value="precision_bigdata">医疗大数据查询</option>';
    }
  } else {
    var filtered = _allQueryTypes.filter(function(t) { return t.queryType.indexOf('precision_') !== 0; });
    if (filtered.length) {
      queryType.innerHTML = filtered.map(function(t) {
        return '<option value="' + t.queryType + '">' + (t.queryName || t.queryType) + '</option>';
      }).join('');
    } else {
      queryType.innerHTML = '<option value="medical_all">医疗大数据</option><option value="medical_insurance">医保信息</option>';
    }
  }
}

function doQuery() {
  var name = document.getElementById('personName').value.trim();
  var idCard = document.getElementById('idCard').value.trim();
  if (!name || !idCard) { alert('请填写姓名和身份证号'); return; }
  if (!/^[0-9]{17}[0-9Xx]$/.test(idCard)) { alert('请输入正确的 18 位身份证号'); return; }
  if (!_appKey || queryBtn.disabled) { alert('请先接入 AppKey'); return; }

  var qType = queryType.value;
  queryBtn.disabled = true; queryBtn.textContent = '查询中…';
  resultSummary.textContent = '';
  resultRows.innerHTML = '';

  request('/company/embed/medical/query', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ queryType: qType, queryParams: { name: name, idCard: idCard } })
  }).then(function(j) {
    var r = j.data || {};
    var payload = r.data || {};
    resultStatus.textContent = r.resultStatus || '-';
    serviceStatus.textContent = r.serviceStatus || '-';
    resultTime.textContent = new Date().toLocaleString('zh-CN', { hour12: false });
    emptyResult.style.display = 'none';
    resultBody.classList.add('active');

    if (qType === 'precision_insurance') {
      renderPrecisionInsurance(payload);
    } else if (qType === 'precision_bigdata') {
      renderPrecisionBigdata(payload);
    } else if (qType === 'history_medical') {
      renderHistory(payload);
    } else {
      renderRealtime(payload);
    }
    loadRemaining();
  }).catch(function(err) {
    resultSummary.textContent = '请求失败: ' + (err.message || '网络错误');
    resultRows.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#b54708">请检查网络或联系平台运营方</td></tr>';
    resultTime.textContent = new Date().toLocaleString('zh-CN', { hour12: false });
    emptyResult.style.display = 'none';
    resultBody.classList.add('active');
  }).finally(function() {
    queryBtn.disabled = false; queryBtn.textContent = '查询';
  });
}

function renderRealtime(payload) {
  var rows = Array.isArray(payload.records) ? payload.records : [];
  resultSummary.textContent = payload.summary || '查询完成';
  resultRows.innerHTML = rows.length
    ? rows.map(function(r) { return '<tr><td>' + (r.name||'') + '</td><td>' + (r.value||'') + '</td><td>' + (r.remark||'') + '</td></tr>'; }).join('')
    : '<tr><td colspan="3" style="text-align:center;color:#667085">暂无详细数据</td></tr>';
}

function renderHistory(payload) {
  var visits = Array.isArray(payload.clinicVisits) ? payload.clinicVisits : [];
  var hospitals = Array.isArray(payload.hospitalizations) ? payload.hospitalizations : [];
  var bigdata = Array.isArray(payload.bigdataRecords) ? payload.bigdataRecords : [];
  var total = visits.length + hospitals.length + bigdata.length;

  if (total === 0) {
    resultSummary.textContent = '未查询到该患者的延时精准数据';
    resultRows.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#667085">无数据记录</td></tr>';
    return;
  }

  var s = '查询到该患者的详细记录：';
  if (visits.length) s += '就诊记录 ' + visits.length + ' 条、';
  if (hospitals.length) s += '住院信息 ' + hospitals.length + ' 条、';
  if (bigdata.length) s += '大数据 ' + bigdata.length + ' 条、';
  resultSummary.textContent = s.replace(/、$/, '');

  var rows = [];
  visits.forEach(function(v) { rows.push(['就诊记录', v.diseaseName || '-', (v.orgName||'') + ' ' + (v.visitTime||'')]); });
  hospitals.forEach(function(h) { rows.push(['住院信息', h.orgName||'-', '住院 ' + (h.visitStartTime||'') + ' ~ ' + (h.visitEndTime||'') + ' 费用：' + (h.totalFee||'未记录') + '元']); });
  bigdata.forEach(function(b) {
    var j = '';
    try { j = typeof b.dataJson === 'string' ? b.dataJson : JSON.stringify(b.dataJson||{}); } catch(e) {}
    rows.push(['大数据(' + (b.dataCategory||'通用') + ')', b.patientName||'-', j.length > 80 ? j.substring(0,80) + '…' : j||'-']);
  });
  resultRows.innerHTML = rows.map(function(r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('');
}

function resetForm() {
  document.getElementById('personName').value = '';
  document.getElementById('idCard').value = '';
  emptyResult.style.display = 'grid';
  resultBody.classList.remove('active');
  resultTime.textContent = '等待查询';
}

init();

function renderPrecisionInsurance(payload) {
  var visits = Array.isArray(payload.clinicVisits) ? payload.clinicVisits : [];
  var hospitals = Array.isArray(payload.hospitalizations) ? payload.hospitalizations : [];
  var allRecs = visits.concat(hospitals);
  var thead = document.querySelector('#resultTable thead tr');
  thead.innerHTML = '<th style="width:20%">医疗机构</th><th style="width:13%">就诊时间</th><th style="width:10%">类型</th><th style="width:25%">诊断</th><th style="width:17%">备注</th>';
  if (allRecs.length === 0) {
    resultSummary.textContent = '未查询到该患者的医保报销记录';
    resultRows.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#667085">无医保报销记录</td></tr>';
    return;
  }
  resultSummary.textContent = '查询到该患者的医保报销记录，共 ' + allRecs.length + ' 条';
  var rows = [];
  visits.forEach(function(v) { rows.push('<tr><td>' + (v.orgName || '') + '</td><td>' + (v.visitTime || '') + '</td><td>门诊</td><td>' + (v.diseaseName || '-') + '</td><td>' + (v.doctorName || '') + '</td></tr>'); });
  hospitals.forEach(function(h) { rows.push('<tr><td>' + (h.orgName || '') + '</td><td>' + (h.visitStartTime || '') + ' ~ ' + (h.visitEndTime || '') + '</td><td>住院</td><td>' + (h.diseaseName || '-') + '</td><td>住院 ' + (h.days || '') + '天</td></tr>'); });
  resultRows.innerHTML = rows.join('');
}

function renderPrecisionBigdata(payload) {
  var bigdata = Array.isArray(payload.bigdataRecords) ? payload.bigdataRecords : [];
  var thead = document.querySelector('#resultTable thead tr');
  thead.innerHTML = '<th style="width:15%">数据来源</th><th style="width:15%">数据类别</th><th style="width:35%">分析结果</th><th style="width:15%">风险等级</th><th style="width:20%">建议</th>';
  if (bigdata.length === 0) {
    resultSummary.textContent = '未查询到该患者的医疗大数据记录';
    resultRows.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#667085">无大数据记录</td></tr>';
    return;
  }
  resultSummary.textContent = '多源医疗数据聚合分析完成，共 ' + bigdata.length + ' 项指标';
  resultRows.innerHTML = bigdata.map(function(b) {
    var level = '-', suggestion = '';
    try {
      var meta = typeof b.dataJson === 'string' ? JSON.parse(b.dataJson) : (b.dataJson || {});
      level = meta.level || '-';
      suggestion = meta.suggestion || '';
    } catch(e) {}
    var lc = level === '高' ? 'red' : level === '中' ? 'orange' : 'green';
    return '<tr><td>' + (b.source || b.dataCategory || '') + '</td><td>' + (b.dataCategory || '通用') + '</td><td>' + (b.value || '') + '</td><td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;background:' + (lc === 'red' ? '#e04f5f' : lc === 'orange' ? '#e8943a' : '#2e9a6e') + '">' + level + '</span></td><td>' + suggestion + '</td></tr>';
  }).join('');
}


</script>
</body>
</html>
