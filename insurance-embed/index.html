<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>湖南省医疗数据查询平台</title>
  <style>
    :root { --bg:#f4f7fb; --surface:#fff; --line:#dbe3ee; --text:#1f2937; --muted:#667085; --blue:#2563eb; --blue-soft:#eff6ff; --green:#16803c; --green-soft:#ecfdf3; --orange:#b45309; --orange-soft:#fff7ed; --red:#b42318; --red-soft:#fff1f0; --shadow:0 8px 24px rgba(15,35,65,.08); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; line-height:1.5; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .page { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:8px; background:var(--blue); color:#fff; font-weight:800; }
    .brand-title { font-weight:700; font-size:16px; }
    .brand-sub { margin-top:1px; color:var(--muted); font-size:12px; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .status { display:flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:#f8fafc; font-size:12px; font-weight:600; }
    .status .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status.active { border-color:#b7e3c6; color:var(--green); background:var(--green-soft); }
    .status.error { border-color:#f2c4c0; color:var(--red); background:var(--red-soft); }
    .app-key-label { color:var(--muted); font-size:12px; }
    .btn-link { border:0; background:transparent; color:var(--blue); padding:7px 4px; font-weight:600; }
    .main { width:100%; flex:1; min-height:0; padding:20px 24px; }
    .notice { display:none; margin-bottom:18px; padding:12px 14px; border-radius:8px; border:1px solid #f2c4c0; color:var(--red); background:var(--red-soft); }
    .notice.show { display:block; }
    .workspace { height:100%; display:grid; grid-template-columns:380px minmax(0,1fr); gap:20px; align-items:stretch; }
    .panel { height:100%; min-height:0; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
    .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:20px 22px 14px; border-bottom:1px solid var(--line); }
    .panel-title { margin:0; font-size:16px; }
    .panel-desc { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .panel-body { padding:20px 22px; }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label { color:#475467; font-size:12px; font-weight:600; }
    .field input { width:100%; height:42px; padding:0 12px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:#fff; outline:none; }
    .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .field input::placeholder { color:#98a2b3; }
    .key-row { display:flex; gap:8px; }
    .key-row input { width:auto; min-width:0; flex:1 1 auto; }
    .key-row button { flex:0 0 auto; }
    .hint { min-height:18px; margin-top:-8px; margin-bottom:14px; color:var(--muted); font-size:12px; }
    .btn { min-height:40px; padding:0 15px; border:1px solid var(--line); border-radius:7px; background:#fff; color:#344054; font-weight:600; }
    .btn:hover:not(:disabled) { border-color:#9db6e8; background:#f8fbff; }
    .btn-primary { width:100%; border-color:var(--blue); background:var(--blue); color:#fff; }
    .btn-primary:hover:not(:disabled) { background:#1d4ed8; }
    .btn:disabled { cursor:not-allowed; opacity:.5; }
    .divider { height:1px; margin:20px 0; background:var(--line); }
    .result-shell { display:flex; flex-direction:column; }
    .result-empty { flex:1; min-height:300px; display:grid; place-items:center; padding:30px; text-align:center; color:var(--muted); }
    .empty-icon { width:54px; height:54px; display:grid; place-items:center; margin:0 auto 12px; border-radius:50%; color:var(--blue); background:var(--blue-soft); font-size:24px; }
    .empty-title { color:#344054; font-weight:600; }
    .empty-copy { margin-top:4px; font-size:12px; }
    .result-content { display:none; }
    .result-content.show { display:block; }
    .result-filters { display:grid; grid-template-columns:1fr 1.35fr 1fr 1fr 1.1fr 1.1fr auto; gap:12px; align-items:end; padding:18px 22px; background:#fbfcfe; border-bottom:1px solid var(--line); }
    .filter-field { min-width:0; }
    .filter-field label { display:block; margin-bottom:6px; color:#475467; font-size:12px; font-weight:600; }
    .filter-field input, .filter-field select { width:100%; height:38px; padding:0 10px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:#fff; outline:none; }
    .filter-field input:focus, .filter-field select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .filter-actions { display:flex; gap:8px; }
    .filter-actions .btn { min-height:38px; white-space:nowrap; }
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:999px; font-size:11px; font-weight:700; }
    .badge.pending { color:var(--orange); background:var(--orange-soft); }
    .badge.success { color:var(--green); background:var(--green-soft); }
    .badge.error { color:var(--red); background:var(--red-soft); }
    .result-body { padding:20px 22px; }
    .result-toolbar { display:none; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:20px; margin-bottom:16px; }
    .result-toolbar.show { display:flex; }
    .result-toolbar.show { display:grid; }
    .result-person { min-width:0; display:flex; justify-content:center; gap:24px; color:#475467; font-size:13px; }
    .result-person strong { color:#1d2939; font-weight:700; }
    .result-detail-title { font-weight:700; color:#344054; text-align:right; white-space:nowrap; }
    .btn-view { min-height:30px; padding:0 12px; border:1px solid #bfd0f4; border-radius:6px; color:var(--blue); background:var(--blue-soft); font-weight:600; }
    .btn-view:hover { border-color:var(--blue); background:#e3edff; }
    .result-action { display:flex; align-items:center; gap:10px; min-height:30px; }
    .btn-cancel { min-height:30px; padding:0 12px; border:1px solid #f3b7b1; border-radius:6px; color:#b42318; background:#fff5f4; font-weight:600; }
    .btn-cancel:hover { border-color:#d92d20; background:#fee4e2; }
    .btn-cancel:disabled { cursor:not-allowed; opacity:.55; }
    .result-summary { margin:0 0 16px; color:#475467; }
    .summary-count { color:var(--red); font-weight:800; }
    .pending-text { color:var(--orange); font-weight:700; }
    .result-table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; }
    .result-table { width:100%; border-collapse:collapse; min-width:500px; }
    .result-table th, .result-table td { padding:11px 13px; border-right:1px solid #c5d0df; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    .result-table th:last-child, .result-table td:last-child { border-right:0; }
    .result-table th { color:#475467; background:#f8fafc; font-size:12px; font-weight:700; }
    .result-table td { font-size:13px; }
    .result-table tr:last-child td { border-bottom:0; }
    .coverage-result { margin-top:22px; }
    .coverage-result h3 { margin:0 0 10px; color:#344054; font-size:14px; }
    .polling { display:none; margin-top:14px; padding:12px 14px; border-radius:8px; color:var(--orange); background:var(--orange-soft); font-size:12px; }
    .polling.show { display:block; }
    .footnote { margin-top:18px; color:var(--muted); font-size:12px; }
    .selection-step { margin-bottom:16px; }
    .selector-label { margin-bottom:6px; color:#475467; font-size:12px; font-weight:600; }
    .mode-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px; border:1px solid var(--line); border-radius:8px; background:#f8fafc; }
    .mode-tab { min-height:34px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-weight:600; }
    .mode-tab.active { color:var(--blue); background:#fff; box-shadow:0 1px 3px rgba(15,35,65,.12); }
    .mode-panel { display:none; }
    .mode-panel.show { display:block; }
    .file-name { margin:8px 0 12px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .batch-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .batch-actions .btn { flex:1 1 130px; }
    .preview-summary { margin:12px 0; color:#475467; font-size:12px; }
    .preview-wrap { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
    .preview-table { width:100%; border-collapse:collapse; min-width:430px; }
    .preview-table th, .preview-table td { padding:8px; border-bottom:1px solid var(--line); text-align:left; font-size:12px; }
    .preview-table th { position:sticky; top:0; color:#475467; background:#f8fafc; }
    .preview-table input { width:100%; min-width:110px; height:30px; padding:0 7px; border:1px solid var(--line); border-radius:5px; }
    .row-invalid { background:var(--red-soft); }
    @media (max-width:1100px) { .result-filters { grid-template-columns:repeat(3,minmax(0,1fr)); } .filter-actions { align-self:end; } }
    @media (max-width:800px) { .page { height:auto; min-height:100vh; overflow:visible; } .topbar { padding:13px 16px; align-items:flex-start; } .top-actions { flex-wrap:wrap; justify-content:flex-end; } .main { padding:16px; } .workspace { width:100%; min-width:0; height:auto; grid-template-columns:minmax(0,1fr); } .panel { width:100%; min-width:0; height:auto; overflow:visible; } .result-shell { min-height:520px; } .result-filters { grid-template-columns:1fr 1fr; } .result-toolbar.show { width:100%; min-width:0; grid-template-columns:auto minmax(0,1fr); } .result-person { min-width:0; grid-column:1 / -1; grid-row:2; justify-content:flex-start; flex-wrap:wrap; } .result-detail-title { min-width:0; white-space:normal; overflow-wrap:anywhere; } }
    @media (max-width:480px) { .app-key-label { display:none; } .topbar { gap:8px; flex-wrap:wrap; } .top-actions { width:100%; justify-content:flex-end; } .result-filters { grid-template-columns:1fr; padding-left:16px; padding-right:16px; } .filter-actions .btn { flex:1; } .panel-head, .panel-body, .result-body { padding-left:16px; padding-right:16px; } .result-toolbar.show { grid-template-columns:1fr; } .result-detail-title { grid-row:2; text-align:left; } .result-person { grid-row:3; gap:8px 16px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">医</div><div><div class="brand-title">湖南省医疗数据查询平台</div><div class="brand-sub">保险公司嵌入式医疗数据查询服务</div></div></div>
      <div class="top-actions"><span class="app-key-label" id="appKeyLabel">未接入</span><span class="status" id="accessStatus"><span class="dot"></span><span id="accessText">待接入</span></span><button class="btn-link" id="resetBtn" type="button">重新接入</button></div>
    </header>
    <main class="main">
      <div class="notice" id="notice" role="alert"></div>
      <div class="workspace">
        <section class="panel">
          <div class="panel-head"><div><h1 class="panel-title" id="queryPanelTitle">精准延时查询</h1><p class="panel-desc" id="queryPanelDesc">提交后由平台人员处理，完成后可查看结果</p></div></div>
          <div class="panel-body">
            <div class="field"><label for="appKey">AppKey</label><div class="key-row"><input id="appKey" type="password" autocomplete="off" placeholder="请输入保险公司 AppKey"><button class="btn" id="connectBtn" type="button">验证接入</button></div></div>
            <div class="hint" id="accessHint">AppKey 仅保存在当前页面内存中，刷新页面后需要重新验证。</div>
            <div class="divider"></div>
            <div class="selection-step"><div class="selector-label">查询方式</div><div class="mode-tabs"><button class="mode-tab active" id="delayedTimingBtn" type="button">延时精准查询</button><button class="mode-tab" id="realtimeTimingBtn" type="button">实时查询</button></div></div>
            <div class="selection-step"><div class="selector-label">数据类型</div><div class="mode-tabs"><button class="mode-tab active" id="medicalQueryBtn" type="button">医保查询</button><button class="mode-tab" id="bigDataQueryBtn" type="button">大数据查询</button></div></div>
            <div class="selection-step"><div class="selector-label">查询对象</div><div class="mode-tabs"><button class="mode-tab active" id="singleModeBtn" type="button">单人查询</button><button class="mode-tab" id="batchModeBtn" type="button">批量查询</button></div></div>
            <div class="mode-panel show" id="singlePanel">
              <div class="field"><label for="personName">姓名</label><input id="personName" type="text" maxlength="30" autocomplete="off" placeholder="请输入投保人姓名"></div>
              <div class="field"><label for="idCard">身份证号</label><input id="idCard" type="text" maxlength="18" autocomplete="off" placeholder="请输入 18 位身份证号"></div>
              <button class="btn btn-primary" id="submitBtn" type="button" disabled>提交精准延时查询</button>
            </div>
            <div class="mode-panel" id="batchPanel">
              <input id="batchFile" type="file" accept=".xls,.xlsx" hidden>
              <button class="btn" id="chooseBatchBtn" type="button" disabled>选择 Excel 名单</button>
              <div class="file-name" id="batchFileName">请选择包含“姓名”和“身份证号”列的 Excel 文件</div>
              <div class="preview-summary" id="previewSummary"></div>
              <div class="preview-wrap" id="previewWrap" hidden><table class="preview-table"><thead><tr><th>行号</th><th>姓名</th><th>身份证号</th><th>校验</th></tr></thead><tbody id="previewRows"></tbody></table></div>
              <div class="batch-actions"><button class="btn" id="validateBatchBtn" type="button" disabled>重新校验</button><button class="btn btn-primary" id="submitBatchBtn" type="button" disabled>确认提交批次</button></div>
            </div>
            <div class="footnote">同一公司相同姓名和身份证号存在未完成请求时，平台会复用原请求，不重复计费。</div>
          </div>
        </section>
        <section class="panel result-shell">
          <div class="panel-head"><div><h2 class="panel-title">查询结果</h2><p class="panel-desc">提交请求后，这里会显示处理状态</p></div></div>
          <div class="result-empty" id="resultEmpty"><div><div class="empty-icon">⌕</div><div class="empty-title">暂无查询记录</div><div class="empty-copy">验证 AppKey 后填写人员信息即可提交</div></div></div>
          <div class="result-content" id="resultContent">
            <div class="result-filters"><div class="filter-field"><label for="resultFilterName">姓名</label><input id="resultFilterName" type="text" placeholder="请输入姓名"></div><div class="filter-field"><label for="resultFilterIdCard">身份证号</label><input id="resultFilterIdCard" type="text" placeholder="请输入身份证号"></div><div class="filter-field"><label for="resultFilterType">查询类型</label><select id="resultFilterType"><option value="">全部</option><option value="MEDICAL">医保查询</option><option value="BIG_DATA">大数据查询</option></select></div><div class="filter-field"><label for="resultFilterStatus">处理状态</label><select id="resultFilterStatus"><option value="">全部</option><option value="PENDING">待处理</option><option value="COMPLETED">已完成</option><option value="CANCELLED">已取消</option></select></div><div class="filter-field"><label for="resultFilterBegin">提交开始日期</label><input id="resultFilterBegin" type="date"></div><div class="filter-field"><label for="resultFilterEnd">提交结束日期</label><input id="resultFilterEnd" type="date"></div><div class="filter-actions"><button class="btn btn-primary" id="resultFilterBtn" type="button">查询</button><button class="btn" id="resultFilterResetBtn" type="button">重置</button></div></div>
            <div class="result-body"><div class="result-toolbar" id="resultToolbar"><button class="btn" id="backToResultsBtn" type="button">返回查询结果</button><div class="result-person"><span>姓名：<strong id="resultPersonName">-</strong></span><span>身份证号：<strong id="resultPersonIdCard">-</strong></span></div><span class="result-detail-title" id="resultDetailTitle"></span></div><p class="result-summary" id="resultSummary">-</p><div class="result-table-wrap" id="resultTableWrap" hidden><table class="result-table"><thead id="resultHead"></thead><tbody id="resultRows"></tbody></table></div><div class="coverage-result" id="coverageResult" hidden><h3>参保信息</h3><div class="result-table-wrap"><table class="result-table"><thead id="coverageHead"></thead><tbody id="coverageRows"></tbody></table></div></div></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="./config.js"></script>
  <script>
    (function () {
      'use strict';
      var API_BASE = (window.EMBEDDED_API_BASE || document.documentElement.dataset.apiBase || '').replace(/\/$/, '');
      var appKey = '';
      var requestNo = '';
      var batchNo = '';
      var batchRows = [];
      var batchInvalidCount = 0;
      var latestRequests = [];
      var selectedResultRequestNo = '';
      var pollTimer = null;
      var timingMode = 'DELAYED';
      var dataQueryType = 'MEDICAL';
      var el = function (id) { return document.getElementById(id); };
      var statusLabels = { PENDING:'待处理', PROCESSING:'处理中', COMPLETED:'已完成', FAILED:'处理失败', CANCELLED:'已取消' };
      var resultLabels = { HIT:'查得', NO_RESULT:'未查得', HINT_ONLY:'提示', FAILED:'失败' };
      function api(path, options) {
        options = options || {};
        options.headers = Object.assign({ Accept:'application/json', 'X-App-Key':appKey }, options.headers || {});
        return fetch(API_BASE + path, options).catch(function () {
          throw new Error('无法连接查询服务，请确认 API 地址和后端服务状态');
        }).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (json) {
            if (!response.ok || json.code !== 200) { var error = new Error(json.msg || '请求失败'); error.code = json.errorCode || ('HTTP_' + response.status); throw error; }
            return json.data;
          });
        });
      }
      function setAccess(state, text) { el('accessStatus').className = 'status ' + (state || ''); el('accessText').textContent = text; }
      function showNotice(message) { el('notice').textContent = message || ''; el('notice').classList.toggle('show', !!message); }
      function maskKey(key) { return key.length > 8 ? key.slice(0,4) + '****' + key.slice(-4) : '****'; }
      function refreshActionState() {
        var delayedReady = !!appKey && timingMode === 'DELAYED';
        el('submitBtn').disabled = !delayedReady;
        el('chooseBatchBtn').disabled = !delayedReady;
        el('validateBatchBtn').disabled = !delayedReady || !batchRows.length;
        el('submitBatchBtn').disabled = !delayedReady || !batchRows.length || batchInvalidCount > 0;
        el('submitBtn').textContent = timingMode === 'REALTIME' ? '实时查询待接入' : '提交精准延时查询';
        el('queryPanelTitle').textContent = timingMode === 'REALTIME' ? '实时查询' : '精准延时查询';
        el('queryPanelDesc').textContent = timingMode === 'REALTIME' ? '实时查询界面已开放，服务接口将在后续接入' : '提交后由平台人员处理，完成后可查看结果';
      }
      function connect() {
        var value = el('appKey').value.trim();
        if (!value) { showNotice('请输入 AppKey'); return; }
        appKey = value; el('connectBtn').disabled = true; setAccess('', '验证中'); el('accessHint').textContent = '正在验证 AppKey…'; showNotice('');
        api('/company/embed/medical/access').then(function (data) {
          if (!data.capabilities || !data.capabilities.singleDelayed) throw new Error('当前公司未开通单人精准延时查询');
          el('appKeyLabel').textContent = data.appKeyMasked || maskKey(value); el('accessHint').textContent = (data.companyName || '当前公司') + ' 已接入'; setAccess('active','已接入'); refreshActionState(); pollHistory();
      }).catch(function (error) { appKey = ''; el('appKeyLabel').textContent = '未接入'; el('accessHint').textContent = error.message; setAccess('error','接入失败'); showNotice(error.message); refreshActionState(); }).finally(function () { el('connectBtn').disabled = false; });
      }
      function reset() { if (pollTimer) clearTimeout(pollTimer); pollTimer = null; appKey = ''; requestNo = ''; batchNo = ''; latestRequests = []; selectedResultRequestNo = ''; el('appKey').value = ''; el('appKeyLabel').textContent = '未接入'; el('accessHint').textContent = 'AppKey 仅保存在当前页面内存中，刷新页面后需要重新验证。'; setAccess('','待接入'); el('resultEmpty').style.display = ''; el('resultContent').classList.remove('show'); el('resultToolbar').classList.remove('show'); showNotice(''); refreshActionState(); }
      function validatePerson() { var name = el('personName').value.trim(); var id = el('idCard').value.trim().toUpperCase(); if (!name) return '请输入姓名'; if (!/^[0-9]{17}[0-9X]$/.test(id)) return '请输入正确的 18 位身份证号'; return ''; }
      function submit() { if (timingMode !== 'DELAYED') return; var invalid = validatePerson(); if (invalid) { showNotice(invalid); return; } showNotice(''); el('submitBtn').disabled = true; el('submitBtn').textContent = '提交中…'; api('/company/embed/medical/delayed/requests', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ name:el('personName').value.trim(), idCard:el('idCard').value.trim().toUpperCase(), queryType:dataQueryType }) }).then(function (data) { requestNo = data.requestNo || ''; showNotice(''); pollHistory(); }).catch(function (error) { showNotice(error.message); }).finally(refreshActionState); }
      function pollHistory() {
        if (!appKey) return;
        if (pollTimer) clearTimeout(pollTimer);
        api('/company/embed/medical/history/requests').then(function (items) {
          latestRequests = Array.isArray(items) ? items : [];
          if (selectedResultRequestNo) renderSelectedResult(); else renderUnifiedResults();
        }).catch(function (error) {
          showNotice(error.message);
        }).finally(function () {
          if (appKey) pollTimer = setTimeout(pollHistory,5000);
        });
      }

      function renderUnifiedResults() {

      function filterResultItems(items) {

      function cancelRequest(cancelRequestNo, button) { if (!cancelRequestNo || !window.confirm('确认取消这条查询申请吗？取消后管理后台将不能再处理该申请。')) return; button.disabled = true; api('/company/embed/medical/delayed/requests/' + encodeURIComponent(cancelRequestNo) + '/cancel', { method:'POST' }).then(function () { showNotice(''); return pollHistory(); }).catch(function (error) { showNotice(error.message); button.disabled = false; }); }

      el('connectBtn').addEventListener('click',connect); el('resetBtn').addEventListener('click',reset); el('submitBtn').addEventListener('click',submit); el('delayedTimingBtn').addEventListener('click',function () { switchTiming(false); }); el('realtimeTimingBtn').addEventListener('click',function () { switchTiming(true); }); el('medicalQueryBtn').addEventListener('click',function () { switchDataQuery(false); }); el('bigDataQueryBtn').addEventListener('click',function () { switchDataQuery(true); }); el('singleModeBtn').addEventListener('click',function () { switchMode(false); }); el('batchModeBtn').addEventListener('click',function () { switchMode(true); }); el('chooseBatchBtn').addEventListener('click',function () { el('batchFile').click(); }); el('batchFile').addEventListener('change',function () { var file = this.files && this.files[0]; if (!file) return; el('batchFileName').textContent = file.name; uploadBatch(file).then(renderBatchPreview).catch(function (error) { showNotice(error.message); }); }); el('validateBatchBtn').addEventListener('click',validateBatch); el('submitBatchBtn').addEventListener('click',submitBatch); el('resultFilterBtn').addEventListener('click',renderUnifiedResults); el('resultFilterResetBtn').addEventListener('click',resetResultFilters); el('backToResultsBtn').addEventListener('click',backToResults); el('resultRows').addEventListener('click',function (event) { var cancelButton = event.target.closest('[data-cancel-request-no]'); if (cancelButton) { cancelRequest(cancelButton.dataset.cancelRequestNo, cancelButton); return; } var button = event.target.closest('[data-result-request-no]'); if (button) showResultDetail(button.dataset.resultRequestNo); }); el('previewRows').addEventListener('input',function (event) { var input = event.target; if (!input.dataset || input.dataset.index === undefined) return; batchRows[Number(input.dataset.index)][input.dataset.field] = input.value; }); el('idCard').addEventListener('input',function () { this.val
